<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Albert ☏</title>
<meta name="description" content="Albert ☏ — сайты, ИИ видео и фото, аватары и обложки, аккаунты Telegram">
<style>
  :root{
    --bg:#070001; --card:#1a0000; --red:#e8281e; --red2:#ff4d3d; --line:#8a1410; --text:#fff; --muted:#d9a9b4;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{min-height:100%;background:var(--bg);color:var(--text);
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
  body{
    background:
      radial-gradient(ellipse 80% 40% at 50% 0%,rgba(232,40,30,.45),transparent 70%),
      radial-gradient(ellipse 100% 50% at 50% 100%,rgba(232,40,30,.25),transparent 70%),
      var(--bg);
    min-height:100vh;display:flex;flex-direction:column;align-items:center;
    padding:24px 18px calc(24px + env(safe-area-inset-bottom));
    position:relative;overflow-x:hidden;
  }
  #sparks{position:fixed;inset:0;pointer-events:none;z-index:0}
  .wrap{position:relative;z-index:1;width:100%;max-width:520px;display:flex;flex-direction:column;align-items:center;flex:1}

  .menu-btn{align-self:flex-start;width:56px;height:56px;border-radius:16px;border:2px solid var(--line);
    background:rgba(40,0,0,.5);box-shadow:0 0 18px rgba(232,40,30,.35);cursor:pointer;
    display:flex;flex-direction:column;justify-content:center;align-items:center;gap:7px}
  .menu-btn span{width:28px;height:3px;border-radius:2px;background:var(--red2);display:block}

  .menu{display:none;width:100%;margin-top:12px;border:1px solid var(--line);border-radius:18px;
    background:rgba(26,0,0,.95);padding:8px}
  .menu.open{display:block}
  .menu a{display:block;padding:14px 16px;color:var(--text);text-decoration:none;border-radius:12px;font-size:17px}
  .menu a:active{background:rgba(232,40,30,.2)}

  .avatar{width:150px;height:150px;border-radius:50%;margin-top:-30px;border:4px solid var(--red);
    box-shadow:0 0 40px rgba(232,40,30,.7),inset 0 0 30px rgba(0,0,0,.6);
    background:radial-gradient(circle at 35% 30%,#ff6a55,#8a0f0a 60%,#200000);
    display:flex;align-items:center;justify-content:center;font-size:72px;font-weight:800;color:#fff;
    overflow:hidden}
  .avatar img{width:100%;height:100%;object-fit:cover}

  h1{margin-top:34px;font-size:clamp(42px,13vw,64px);letter-spacing:.12em;color:var(--red);
    text-shadow:0 0 22px rgba(232,40,30,.7);font-weight:900;text-align:center}
  .sub{margin-top:14px;text-align:center;font-size:clamp(18px,5.4vw,26px);color:var(--muted);
    letter-spacing:.06em;line-height:1.4}

  .list{width:100%;margin-top:42px;display:flex;flex-direction:column;gap:20px}
  .item{display:flex;align-items:center;gap:14px;padding:26px 24px;border:2px solid var(--line);
    border-left:6px solid var(--red);border-radius:26px;background:linear-gradient(180deg,#1f0000,#150000);
    font-size:clamp(19px,5.6vw,26px);line-height:1.3;
    box-shadow:0 0 22px rgba(232,40,30,.12);transition:transform .15s,box-shadow .15s}
  .item:active{transform:scale(.98);box-shadow:0 0 28px rgba(232,40,30,.4)}
  .item .ic{font-size:1.3em}

  .spacer{flex:1;min-height:40px}
  .cta{display:block;width:100%;margin-top:30px;text-align:center;text-decoration:none;color:#fff;
    font-weight:800;letter-spacing:.14em;font-size:clamp(19px,5.6vw,26px);padding:30px 20px;border-radius:60px;
    background:linear-gradient(90deg,#e8281e,#8f1a12);box-shadow:0 0 40px rgba(232,40,30,.55)}
  .cta:active{transform:scale(.98)}
  .foot{margin-top:18px;padding:16px 28px;border:2px solid var(--line);border-radius:40px;
    font-size:18px;color:var(--muted);text-align:center}
  .foot b{color:#fff;font-weight:500}
</style>
</head>
<body>
<canvas id="sparks"></canvas>
<div class="wrap">
  <button class="menu-btn" id="menuBtn" aria-label="Меню"><span></span><span></span><span></span></button>
  <nav class="menu" id="menu">
    <a href="#services">Услуги</a>
    <a href="https://t.me/iluep">Telegram</a>
  </nav>

  <!-- Положи файл avatar.jpg рядом с index.html — он появится здесь автоматически -->
  <div class="avatar"><img src="avatar.jpg" alt="Albert" onerror="this.remove();this.parentNode.textContent='A'"></div>

  <h1>Albert ☏</h1>
  <p class="sub">Сайты • ИИ • Дизайн • Telegram</p>

  <div class="list" id="services">
    <div class="item"><span class="ic">📱</span><span>Продажа физических аккаунтов TG</span></div>
    <div class="item"><span class="ic">🌐</span><span>Создание сайтов и загрузка на домен + хостинг</span></div>
    <div class="item"><span class="ic">🎬</span><span>Сделать видео и фото ИИ</span></div>
    <div class="item"><span class="ic">🎨</span><span>Сделать аватар и обложки</span></div>
    <div class="item"><span class="ic">🔍</span><span>Обучение Osint</span></div>
  </div>

  <div class="spacer"></div>
  <a class="cta" href="https://t.me/iluep">СВЯЗАТЬСЯ С ПРОДАВЦОМ</a></div>

<script>
  document.getElementById('menuBtn').onclick=function(){document.getElementById('menu').classList.toggle('open')};

  // red sparks
  var c=document.getElementById('sparks'),x=c.getContext('2d'),P=[];
  function size(){c.width=innerWidth;c.height=innerHeight}
  size();addEventListener('resize',size);
  for(var i=0;i<40;i++)P.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*2+1,v:Math.random()*.4+.1,a:Math.random()*.6+.2});
  (function loop(){
    x.clearRect(0,0,c.width,c.height);
    P.forEach(function(p){
      p.y-=p.v;if(p.y<-5){p.y=c.height+5;p.x=Math.random()*c.width}
      x.beginPath();x.arc(p.x,p.y,p.r,0,6.283);x.fillStyle='rgba(255,70,50,'+p.a+')';x.fill();
    });
    requestAnimationFrame(loop);
  })();
</script>
</body>
</html>
