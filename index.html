  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.5;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 56px;
    display: flex;
    justify-content: center;
    position: relative;
    overflow-x: hidden;
  }
  .backdrop {
    position: fixed;
    inset: -60px;
    background: var(--ava) center / cover no-repeat;
    filter: blur(48px) saturate(0.7);
    opacity: 0.32;
    z-index: -1;
    pointer-events: none;
  }
  main {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    gap: 36px;
  }
  header {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    text-align: center;
  }
  .avatar {
    width: 128px;
    height: 128px;
    border-radius: 50%;
    background: var(--ava) center / cover no-repeat;
    border: 1px solid var(--line);
    box-shadow: 0 0 0 6px var(--bg), 0 0 0 7px var(--line);
  }
  h1 {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 30px;
    line-height: 1.2;
    letter-spacing: 0.02em;
    text-wrap: balance;
  }
  .about {
    margin: 0;
    color: var(--muted);
    max-width: 30ch;
    text-wrap: balance;
  }
  nav {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .link {
    display: flex;
    align-items: center;
    gap: 16px;
    min-width: 0;
    padding: 18px 20px;
    border-radius: 18px;
    text-decoration: none;
    color: var(--fg);
    background: var(--surface);
    border: 1px solid var(--line);
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  .link.primary {
    background: var(--accent);
    color: var(--on-accent);
    border-color: var(--accent);
  }
  .link:hover { transform: translateY(-2px); }
  .link:not(.primary):hover { border-color: var(--muted); }
  .link:focus-visible,
  .music:focus-visible {
    outline: 3px solid var(--fg);
    outline-offset: 3px;
  }
  .link .text {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
  }
  .link .title {
    font-weight: 600;
    font-size: 18px;
    line-height: 1.3;
  }
  .link .hint {
    font-size: 14px;
    opacity: 0.7;
    overflow-wrap: anywhere;
  }
  .link svg { flex: none; width: 26px; height: 26px; }
  .link .arrow { width: 20px; height: 20px; opacity: 0.7; }

  .music-wrap { display: flex; justify-content: center; }
  .music {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 10px 18px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 14px;
    cursor: pointer;
    transition: color 0.15s ease, border-color 0.15s ease;
  }
  .music:hover { color: var(--fg); border-color: var(--muted); }
  .music[aria-pressed="true"] { color: var(--fg); border-color: var(--muted); }
  .bars { display: inline-flex; align-items: flex-end; gap: 3px; height: 14px; }
  .bars i {
    display: block;
    width: 3px;
    height: 4px;
    border-radius: 2px;
    background: currentColor;
  }
  .music[aria-pressed="true"] .bars i { animation: eq 1.1s ease-in-out infinite; }
  .music[aria-pressed="true"] .bars i:nth-child(2) { animation-delay: -0.4s; }
  .music[aria-pressed="true"] .bars i:nth-child(3) { animation-delay: -0.8s; }
  @keyframes eq { 0%, 100% { height: 4px; } 50% { height: 14px; } }

  @media (prefers-reduced-motion: reduce) {
    .link { transition: none; }
    .link:hover { transform: none; }
    .music[aria-pressed="true"] .bars i { animation: none; height: 10px; }
  }
</style>

    </button>

<script>
(function () {
  var btn = document.getElementById('music');
  var label = document.getElementById('music-label');
  var ctx = null, master = null, bus = null, timer = null, on = false;
  var scale = [220, 261.63, 293.66, 329.63, 392, 440, 523.25];

  function build() {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = 0;

    var len = ctx.sampleRate * 4;
    var imp = ctx.createBuffer(2, len, ctx.sampleRate);
    for (var c = 0; c < 2; c++) {
      var d = imp.getChannelData(c);
      for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
    }
    var verb = ctx.createConvolver();
    verb.buffer = imp;
    var wet = ctx.createGain(); wet.gain.value = 0.6;
    var dry = ctx.createGain(); dry.gain.value = 0.7;
    verb.connect(wet); wet.connect(master);
    dry.connect(master); master.connect(ctx.destination);
    bus = ctx.createGain();
    bus.connect(dry); bus.connect(verb);

    var filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 1000;
    filter.Q.value = 0.7;
    filter.connect(bus);

    var lfo = ctx.createOscillator();
    lfo.frequency.value = 0.05;
    var lg = ctx.createGain();
    lg.gain.value = 400;
    lfo.connect(lg); lg.connect(filter.frequency);
    lfo.start();

    [110, 164.81, 220, 261.63, 329.63].forEach(function (f, i) {
      [-4, 4].forEach(function (det) {
        var o = ctx.createOscillator();
        o.type = i < 2 ? 'sawtooth' : 'triangle';
        o.frequency.value = f;
        o.detune.value = det;
        var g = ctx.createGain();
        g.gain.value = i < 2 ? 0.05 : 0.035;
        o.connect(g); g.connect(filter);
        o.start();
      });
    });
    return true;
  }

  function note() {
    if (!on || !ctx) return;
    var f = scale[Math.floor(Math.random() * scale.length)];
    var o = ctx.createOscillator();
    o.type = 'sine';
    o.frequency.value = f;
    var g = ctx.createGain();
    var t = ctx.currentTime;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.09, t + 0.05);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 5);
    o.connect(g); g.connect(bus);
    o.start(t); o.stop(t + 5.2);
    timer = setTimeout(note, 2500 + Math.random() * 4500);
  }

  function setState(next) {
    on = next;
    btn.setAttribute('aria-pressed', next ? 'true' : 'false');
    label.textContent = next ? 'Выключить музыку' : 'Включить музыку';
  }

  btn.addEventListener('click', function () {
    try {
      if (!on) {
        if (!ctx && !build()) return;
        ctx.resume();
        setState(true);
        var t = ctx.currentTime;
        master.gain.cancelScheduledValues(t);
        master.gain.setValueAtTime(master.gain.value, t);
        master.gain.linearRampToValueAtTime(0.7, t + 2);
        note();
      } else {
        setState(false);
        clearTimeout(timer);
        var t2 = ctx.currentTime;
        master.gain.cancelScheduledValues(t2);
        master.gain.setValueAtTime(master.gain.value, t2);
        master.gain.linearRampToValueAtTime(0, t2 + 1);
        setTimeout(function () { if (!on && ctx) ctx.suspend(); }, 1200);
      }
    } catch (e) {}
  });

  document.addEventListener('visibilitychange', function () {
    try {
      if (!ctx || !on) return;
      if (document.hidden) { ctx.suspend(); } else { ctx.resume(); }
    } catch (e) {}
  });
})();
</script>
